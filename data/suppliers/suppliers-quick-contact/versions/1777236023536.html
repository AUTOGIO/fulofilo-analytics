<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Suppliers Quick Contact",
  "schemaVersion": 1,
  "description": "Interactive supplier contact dashboard for FuloFilo — 9 suppliers with one-tap WhatsApp links, filter by state/product category, and delivery time badge."
}
</script>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuloFilo – Fornecedores</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4fb; color: #1a1a2e; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #1F3864 0%, #2E75B6 100%);
    color: #fff; padding: 18px 24px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; }
  header .badge { background: rgba(255,255,255,.2); border-radius: 20px; padding: 3px 12px; font-size: .8rem; }

  .controls {
    padding: 14px 20px; background: #fff; border-bottom: 1px solid #dde3f0;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .controls input {
    flex: 1; min-width: 200px; padding: 8px 14px; border: 1.5px solid #c5d0e8;
    border-radius: 8px; font-size: .9rem; outline: none;
  }
  .controls input:focus { border-color: #2E75B6; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 14px; border-radius: 20px; border: 1.5px solid #c5d0e8;
    background: #fff; font-size: .8rem; cursor: pointer; transition: all .15s;
    color: #444; font-weight: 500;
  }
  .chip:hover { border-color: #2E75B6; color: #2E75B6; }
  .chip.active { background: #2E75B6; border-color: #2E75B6; color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 16px; padding: 20px;
  }

  .card {
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.07); border: 1.5px solid #e4eaf5;
    transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30,60,120,.13); }

  .card-header {
    padding: 12px 16px 10px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: #fff;
  }
  .card-name { font-weight: 700; font-size: .95rem; color: #1F3864; line-height: 1.3; }
  .card-contact { font-size: .8rem; color: #666; margin-top: 2px; }

  .card-body { padding: 0 16px 6px; flex: 1; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    padding: 2px 10px; border-radius: 12px; font-size: .72rem; font-weight: 600;
  }
  .tag-state  { background: #eef3fd; color: #2E75B6; }
  .tag-delivery { background: #e8f5e9; color: #2e7d32; }
  .tag-delivery.slow { background: #fff8e1; color: #f57f17; }
  .tag-delivery.none { background: #f5f5f5; color: #757575; }

  .products {
    font-size: .8rem; color: #444; line-height: 1.5;
    border-top: 1px solid #f0f4fb; padding-top: 8px; margin-top: 4px;
  }
  .products strong { color: #1F3864; font-size: .73rem; text-transform: uppercase;
    letter-spacing: .4px; display: block; margin-bottom: 3px; }

  .card-footer {
    padding: 10px 16px; display: flex; gap: 8px;
    border-top: 1px solid #f0f4fb; background: #fafbfe;
  }
  .btn {
    flex: 1; padding: 8px 6px; border-radius: 8px; border: none;
    cursor: pointer; font-size: .82rem; font-weight: 600; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-wa  { background: #25D366; color: #fff; }
  .btn-call { background: #2E75B6; color: #fff; }
  .btn-na  { background: #e9e9e9; color: #aaa; cursor: default; }

  .empty { text-align: center; padding: 60px 20px; color: #999; grid-column: 1/-1; }
  .count { font-size: .8rem; color: #888; padding: 0 20px 0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📦 FuloFilo – Fornecedores</h1>
  </div>
  <div class="badge">9 fornecedores</div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍  Buscar fornecedor, produto, estado…">
  <div class="filter-group" id="state-filters">
    <button class="chip active" data-state="all">Todos</button>
    <button class="chip" data-state="CE">CE</button>
    <button class="chip" data-state="PE">PE</button>
    <button class="chip" data-state="PB">PB</button>
    <button class="chip" data-state="BA">BA</button>
    <button class="chip" data-state="AL">AL</button>
  </div>
  <div class="filter-group" id="cat-filters">
    <button class="chip active" data-cat="all">Tudo</button>
    <button class="chip" data-cat="chaveiro">Chaveiros</button>
    <button class="chip" data-cat="roupa">Roupas</button>
    <button class="chip" data-cat="bolsa">Bolsas/Nécessaire</button>
    <button class="chip" data-cat="canga">Cangas</button>
  </div>
</div>
<div class="count" id="count-label" style="padding-top:10px"></div>

<div class="grid" id="grid"></div>

<script>
const SUPPLIERS = [
  {

    categories: ["chaveiro"],
    color: "#1F3864"
  },
  {

    phone: "(81) 3724-5546",
    whatsapp: null,
    email: null,
    state: "PE",
    city: "Caruaru",
    delivery: "—",
    deliveryClass: "none",
    products: "Camisas regionais, Bodys, Vestidos, Conjuntos, Cam Silk AC",
    categories: ["roupa"],
    color: "#7B3F00"
  },
  {
    id: 3,
    name: "DISTRIBUIDOR (Genérico)",
    contact: null,

    whatsapp: null,
    email: null,
    state: "—",
    city: null,
    delivery: "—",
    deliveryClass: "none",
    products: "Nec. Styllos, Carteirinha c/Alça, Sacola Copa, Cangas, Porta Calçinha",
    categories: ["bolsa", "canga"],
    color: "#546E7A"
  },
  {
    id: 4,

    contact: "Alan",
    phone: "+55 74 98131-4420",
    whatsapp: "5574981314420",
    email: null,
    state: "BA",
    city: null,
    delivery: "1–3 meses",
    deliveryClass: "slow",
    products: "Bolsa 55, Nécessaire, Carteira alça, Canga elastano, Kit bolsas 125",
    categories: ["bolsa", "canga"],
    color: "#2E75B6"
  },
  {
    id: 5,
    name: "Souvenir Ceará",
    contact: "Cleberson Lima",
    phone: "+55 84 99983-2590",
    whatsapp: "5584999832590",
    email: null,
    state: "CE",
    city: null,
    delivery: "1 mês",
    deliveryClass: "slow",
    products: "Chaveiros de nome, Chaveiros diversos",
    categories: ["chaveiro"],
    color: "#1B5E20"
  },
  {
    id: 6,
    name: "OFICINA DE ARTE – Ecobags",
    contact: null,
    phone: "+55 83 98832-9998",
    whatsapp: "5583988329998",
    email: null,
    state: "PB",
    city: null,
    delivery: "1 semana",
    deliveryClass: "fast",
    products: "Camisas regionais adulto, Baby look, Regata, Cropped, Infantil",
    categories: ["roupa"],
    color: "#4A148C"
  },
  {
    id: 7,
    name: "Vanda Colorido",
    contact: "Ivaneide (Vanda)",
    phone: "+55 83 98744-1466",
    whatsapp: "5583987441466",
    email: null,
    state: "PB",
    city: null,
    delivery: "—",
    deliveryClass: "none",
    products: "Body, Vestido, Macaquinho",
    categories: ["roupa"],
    color: "#AD1457"
  },
  {
    id: 8,
    name: "JUNIOR CHAVEIRO",
    contact: "Junior",
    phone: "+55 84 99869-1997",
    whatsapp: "5584998691997",
    email: null,
    state: "CE",
    city: null,
    delivery: "—",
    deliveryClass: "none",
    products: "Chaveiro de letras",
    categories: ["chaveiro"],
    color: "#E65100"
  },
  {
    id: 9,
    name: "GIRISH INDIANA",
    contact: "Girish",
    phone: "+55 82 99938-1151",
    whatsapp: "5582999381151",
    email: null,
    state: "AL",
    city: null,
    delivery: "—",
    deliveryClass: "none",
    products: "Cangas",
    categories: ["canga"],
    color: "#006064"
  }
];

let activeState = "all";
let activeCat   = "all";
let searchTerm  = "";

function initials(name) {
  return name.split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
}

function renderCards() {
  const q = searchTerm.toLowerCase();
  const filtered = SUPPLIERS.filter(s => {
    const matchState = activeState === "all" || s.state === activeState;
    const matchCat   = activeCat === "all" || s.categories.includes(activeCat);
    const matchQ     = !q ||
      s.name.toLowerCase().includes(q) ||
      s.products.toLowerCase().includes(q) ||
      (s.contact || "").toLowerCase().includes(q) ||
      s.state.toLowerCase().includes(q);
    return matchState && matchCat && matchQ;
  });

  const grid = document.getElementById("grid");
  document.getElementById("count-label").textContent =
    filtered.length + " fornecedor" + (filtered.length !== 1 ? "es" : "") + " encontrado" + (filtered.length !== 1 ? "s" : "");

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">😕 Nenhum fornecedor encontrado.<br>Tente outro filtro ou busca.</div>';
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const phoneNum = s.phone ? s.phone.replace(/\D/g,"") : null;
    const waBtn = s.whatsapp
      ? `<a class="btn btn-wa" href="https://wa.me/${s.whatsapp}" target="_blank">💬 WhatsApp</a>`
      : `<span class="btn btn-na">💬 N/D</span>`;
    const callBtn = s.phone
      ? `<a class="btn btn-call" href="tel:+${phoneNum}">📞 Ligar</a>`
      : `<span class="btn btn-na">📞 N/D</span>`;
    const delivBadge = `<span class="tag tag-delivery ${s.deliveryClass}">⏱ ${s.delivery}</span>`;
    const stateBadge = s.state !== "—" ? `<span class="tag tag-state">${s.state}</span>` : "";
    const contactLine = s.contact ? `<div class="card-contact">👤 ${s.contact}</div>` : "";

    return `
      <div class="card">
        <div class="card-header">
          <div class="avatar" style="background:${s.color}">${initials(s.name)}</div>
          <div>
            <div class="card-name">${s.name}</div>
            ${contactLine}
          </div>
        </div>
        <div class="card-body">
          <div class="tag-row">${stateBadge}${delivBadge}</div>
          <div class="products">
            <strong>Produtos</strong>
            ${s.products}
          </div>
        </div>
        <div class="card-footer">${waBtn}${callBtn}</div>
      </div>`;
  }).join("");
}

// State filter
document.getElementById("state-filters").addEventListener("click", e => {
  if (!e.target.dataset.state) return;
  document.querySelectorAll("[data-state]").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeState = e.target.dataset.state;
  renderCards();
});

// Category filter
document.getElementById("cat-filters").addEventListener("click", e => {
  if (!e.target.dataset.cat) return;
  document.querySelectorAll("[data-cat]").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeCat = e.target.dataset.cat;
  renderCards();
});

// Search
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  renderCards();
});

renderCards();
</script>
</body>
</html>
