<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuloFilo – Fornecedores</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f4fb; color: #1a1a2e; min-height: 100vh; }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #1F3864 0%, #2E75B6 100%);
    color: #fff; padding: 14px 20px 10px;
  }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .5px; }
  .badge { background: rgba(255,255,255,.2); border-radius: 20px; padding: 3px 12px; font-size: .8rem; }

  /* shared file links bar */
  .file-bar {
    display: flex; flex-wrap: wrap; gap: 7px; padding: 0;
  }
  .flink {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 20px; font-size: .78rem; font-weight: 600;
    text-decoration: none; cursor: pointer; transition: opacity .15s; border: none;
    white-space: nowrap;
  }
  .flink:hover { opacity: .82; }
  .flink-excel   { background: #217346; color: #fff; }
  .flink-pdf     { background: #cc2200; color: #fff; }
  .flink-folder  { background: rgba(255,255,255,.18); color: #fff; border: 1.5px solid rgba(255,255,255,.35); }
  .flink-alert   { background: #e65100; color: #fff; }

  /* ── CONTROLS ── */
  .controls {
    padding: 12px 20px; background: #fff; border-bottom: 1px solid #dde3f0;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .controls input {
    flex: 1; min-width: 180px; padding: 7px 13px; border: 1.5px solid #c5d0e8;
    border-radius: 8px; font-size: .9rem; outline: none;
  }
  .controls input:focus { border-color: #2E75B6; }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 4px 13px; border-radius: 20px; border: 1.5px solid #c5d0e8;
    background: #fff; font-size: .78rem; cursor: pointer; transition: all .15s;
    color: #444; font-weight: 500;
  }
  .chip:hover { border-color: #2E75B6; color: #2E75B6; }
  .chip.active { background: #2E75B6; border-color: #2E75B6; color: #fff; }

  .count { font-size: .8rem; color: #888; padding: 10px 20px 0; }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px; padding: 16px 20px 30px;
  }

  /* ── CARD ── */
  .card {
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.07); border: 1.5px solid #e4eaf5;
    transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30,60,120,.13); }

  .card-header { padding: 12px 15px 8px; display: flex; align-items: flex-start; gap: 10px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .95rem; color: #fff;
  }
  .card-name { font-weight: 700; font-size: .92rem; color: #1F3864; line-height: 1.3; }
  .card-contact { font-size: .78rem; color: #666; margin-top: 2px; }

  .card-body { padding: 0 15px 6px; flex: 1; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
  .tag { padding: 2px 9px; border-radius: 12px; font-size: .7rem; font-weight: 600; }
  .tag-state    { background: #eef3fd; color: #2E75B6; }
  .tag-delivery { background: #e8f5e9; color: #2e7d32; }
  .tag-delivery.slow { background: #fff8e1; color: #f57f17; }
  .tag-delivery.none { background: #f5f5f5; color: #757575; }

  .products {
    font-size: .78rem; color: #444; line-height: 1.5;
    border-top: 1px solid #f0f4fb; padding-top: 7px; margin-top: 4px;
  }
  .products strong { color: #1F3864; font-size: .7rem; text-transform: uppercase;
    letter-spacing: .4px; display: block; margin-bottom: 2px; }

  /* file links per card */
  .card-files {
    padding: 8px 15px; border-top: 1px solid #f0f4fb;
    background: #fafbfe; display: flex; flex-wrap: wrap; gap: 5px;
  }
  .card-files-label {
    font-size: .68rem; font-weight: 700; color: #999; text-transform: uppercase;
    letter-spacing: .4px; width: 100%; margin-bottom: 2px;
  }
  .cf {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 14px; font-size: .73rem; font-weight: 600;
    text-decoration: none; cursor: pointer; transition: opacity .15s;
    white-space: nowrap;
  }
  .cf:hover { opacity: .8; }
  .cf-img    { background: #e8f0fe; color: #1a56db; }
  .cf-xls    { background: #e6f4ea; color: #1e7e34; }
  .cf-csv    { background: #fff3e0; color: #b45309; }
  .cf-folder { background: #f3e8ff; color: #7c3aed; }
  .cf-fiscal { background: #fce8e6; color: #c0392b; }

  /* contact buttons */
  .card-footer { padding: 8px 15px; display: flex; gap: 7px; border-top: 1px solid #f0f4fb; }
  .btn {
    flex: 1; padding: 7px 6px; border-radius: 8px; border: none;
    cursor: pointer; font-size: .8rem; font-weight: 600; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-wa   { background: #25D366; color: #fff; }
  .btn-call { background: #2E75B6; color: #fff; }
  .btn-na   { background: #e9e9e9; color: #aaa; cursor: default; }

  .empty { text-align: center; padding: 60px 20px; color: #999; grid-column: 1/-1; }
</style>
</head>

let activeState = "all", activeCat = "all", searchTerm = "";

function initials(name) {
  return name.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function renderFileLinks(fileKeys) {
  if (!fileKeys || !fileKeys.length) return "";
  const items = fileKeys.map(k => {
    const l = LINKS[k];
    if (!l) return "";
    return `<a class="cf ${l.cls}" href="${l.href}" title="${l.title}">${l.label}</a>`;
  }).join("");
  return `<div class="card-files"><div class="card-files-label">📁 Arquivos relacionados</div>${items}</div>`;
}

function render() {
  const q = searchTerm.toLowerCase();
  const filtered = SUPPLIERS.filter(s => {
    const matchState = activeState === "all" || s.state === activeState;
    const matchCat   = activeCat   === "all" || s.categories.includes(activeCat);
    const matchQ     = !q ||
      s.name.toLowerCase().includes(q) ||
      s.products.toLowerCase().includes(q) ||
      (s.contact||"").toLowerCase().includes(q) ||
      s.state.toLowerCase().includes(q);
    return matchState && matchCat && matchQ;
  });

  document.getElementById("count-label").textContent =
    filtered.length + " fornecedor" + (filtered.length!==1?"es":"") +
    " encontrado" + (filtered.length!==1?"s":"");

  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">😕 Nenhum fornecedor encontrado.</div>';
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const phoneNum  = s.phone ? s.phone.replace(/\D/g,"") : null;
    const waBtn     = s.whatsapp
      ? `<a class="btn btn-wa"   href="https://wa.me/${s.whatsapp}" target="_blank">💬 WhatsApp</a>`
      : `<span class="btn btn-na">💬 N/D</span>`;
    const callBtn   = s.phone
      ? `<a class="btn btn-call" href="tel:+${phoneNum}">📞 Ligar</a>`
      : `<span class="btn btn-na">📞 N/D</span>`;
    const stateBadge  = s.state!=="—" ? `<span class="tag tag-state">${s.state}</span>` : "";
    const delivBadge  = `<span class="tag tag-delivery ${s.deliveryClass}">⏱ ${s.delivery}</span>`;
    const contactLine = s.contact ? `<div class="card-contact">👤 ${s.contact}</div>` : "";
    const fileLinks   = renderFileLinks(s.files);

    return `
      <div class="card">
        <div class="card-header">
          <div class="avatar" style="background:${s.color}">${initials(s.name)}</div>
          <div><div class="card-name">${s.name}</div>${contactLine}</div>
        </div>
        <div class="card-body">
          <div class="tag-row">${stateBadge}${delivBadge}</div>
          <div class="products"><strong>Produtos</strong>${s.products}</div>
        </div>
        ${fileLinks}
        <div class="card-footer">${waBtn}${callBtn}</div>
      </div>`;
  }).join("");
}

document.getElementById("state-filters").addEventListener("click", e => {
  if (!e.target.dataset.state) return;
  document.querySelectorAll("[data-state]").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active"); activeState = e.target.dataset.state; render();
});
document.getElementById("cat-filters").addEventListener("click", e => {
  if (!e.target.dataset.cat) return;
  document.querySelectorAll("[data-cat]").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active"); activeCat = e.target.dataset.cat; render();
});
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value; render();
});

render();
</script>
