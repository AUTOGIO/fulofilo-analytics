<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FulôFiló — Fornecedores</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #030303;
  color: #e7e3d7;
  font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
  min-height: 100vh;
}
header {
  background: linear-gradient(180deg, #191919 0%, #080808 100%);
  border-bottom: 1px solid rgba(114,114,114,0.48);
  padding: 14px 18px 10px;
}
.header-top { align-items: center; display: flex; gap: 10px; margin-bottom: 10px; }
h1 { color: #e7e3d7; font-size: 1.33rem; letter-spacing: .04em; text-transform: uppercase; }
.badge { background: #c06e00; color: #050505; font-size: 0.97rem; font-weight: 900; padding: 3px 10px; }
.file-bar { display: flex; flex-wrap: wrap; gap: 7px; }
.flink, .cf, .btn {
  border: 1px solid rgba(114,114,114,0.48);
  color: #f5a623;
  text-decoration: none;
}
.flink { background: #0a0a0a; display: inline-flex; font-size: 1.01rem; font-weight: 800; padding: 5px 12px; }
.controls { background: #050505; border-bottom: 1px solid rgba(114,114,114,0.48); padding: 12px 18px; }
.controls input {
  background: #0c0c0c;
  border: 1px solid rgba(114,114,114,0.48);
  color: #e7e3d7;
  font: inherit;
  outline: none;
  padding: 8px 12px;
  width: min(560px, 100%);
}
.count { color: #9b9588; font-size: 1.01rem; padding: 10px 18px 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); padding: 14px 18px 28px; }
.card { background: #080808; border: 1px solid rgba(114,114,114,0.48); display: flex; flex-direction: column; min-height: 250px; }
.card-header { align-items: flex-start; display: flex; gap: 10px; padding: 12px 14px 8px; }
.avatar { align-items: center; color: #fff; display: flex; flex-shrink: 0; font-size: 1.15rem; font-weight: 800; height: 34px; justify-content: center; width: 34px; }
.card-name { color: #f5a623; font-size: 1.13rem; font-weight: 900; line-height: 1.3; text-transform: uppercase; }
.card-contact { color: #e7e3d7; font-size: 1.01rem; margin-top: 3px; }
.card-body { flex: 1; padding: 0 14px 8px; }
.products { border-top: 1px solid rgba(114,114,114,0.30); color: #e7e3d7; font-size: 1.03rem; line-height: 1.5; padding-top: 8px; }
.products strong { color: #4bb7ff; display: block; font-size: 0.93rem; letter-spacing: .04em; margin-bottom: 2px; text-transform: uppercase; }
.card-files { background: #050505; border-top: 1px solid rgba(114,114,114,0.48); display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 14px; }
.card-files-label { color: #9b9588; font-size: 0.91rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 2px; text-transform: uppercase; width: 100%; }
.cf { background: #0a0a0a; display: inline-flex; font-size: 0.97rem; font-weight: 800; padding: 4px 8px; }
.card-footer { border-top: 1px solid rgba(114,114,114,0.48); display: flex; gap: 6px; padding: 8px 14px; }
.btn { align-items: center; display: flex; flex: 1; font-size: 1.01rem; font-weight: 900; justify-content: center; padding: 7px 6px; }
.btn-call { background: #063b7a; color: #fff; }
.btn-wa { background: #13a84a; color: #050505; }
.btn-na { background: #1a1a1a; color: #9b9588; }
.empty { color: #9b9588; grid-column: 1/-1; padding: 54px 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>AI Insights + Supplier Desk</h1>
    <span class="badge">13 fornecedores</span>
  </div>
  <div class="file-bar">
    <a class="flink" href="file:///Users/eduardofgiovannini/Documents/GitHub/fulofilo-analytics/data/excel/FuloFilo_Master.xlsx">Master Excel</a>
    <a class="flink" href="file:///Users/eduardofgiovannini/Documents/GitHub/fulofilo-analytics/data/suppliers/SUPPLIERS_DB.xlsx">SUPPLIERS_DB.xlsx</a>
    <a class="flink" href="file:///Users/eduardofgiovannini/Documents/GitHub/fulofilo-analytics/data/suppliers/ALL_SUPPLIERS_COMPLETE.pdf">PDF Completo</a>
    <a class="flink" href="file:///Users/eduardofgiovannini/Documents/GitHub/fulofilo-analytics/data/suppliers">Pasta Fornecedores</a>
  </div>
</header>
<div class="controls">
  <input type="text" id="search" placeholder="Buscar fornecedor, produto, estado...">
</div>
<div class="count" id="count-label"></div>
<div class="grid" id="grid"></div>
<script>
const ROOT = "file:///Users/eduardofgiovannini/Documents/GitHub/fulofilo-analytics";
const SUPPLIERS = [{"id": 1, "name": "BRINDES E SOUVENIRS CEARÁ", "contact": "", "phone": "(85) 2180-7491", "whatsapp": "", "state": "CE", "delivery": "", "products": "Chaveiros de nome, Chaveiros premium, Chaveiros signos", "categories": ["chaveiro"], "color": "#1F3864", "files": ["chaveiro_imgs", "keychain_ctrl", "female_keychain"]}, {"id": 2, "name": "ALGODOEIRO ECO FASHION", "contact": "", "phone": "(81) 3724-5546", "whatsapp": "", "state": "PE", "delivery": "", "products": "Camisas regionais, Bodys, Vestidos, Conjuntos, Cam Silk AC", "categories": ["roupa"], "color": "#7B3F00", "files": ["vestuario_imgs", "body_imgs", "master"]}, {"id": 3, "name": "DISTRIBUIDOR (GENÉRICO)", "contact": "", "phone": "", "whatsapp": "", "state": "", "delivery": "", "products": "Nec. Styllos, Carteirinha c/Alça, Sacola Copa, Cangas, Porta Calçinha", "categories": ["bolsa", "canga"], "color": "#546E7A", "files": ["necessaire_imgs", "carteira_imgs", "mercadorias_imgs", "master", "suppliers_folder"]}, {"id": 4, "name": "ALAN BOLSAS", "contact": "Alan", "phone": "+55 74 98131-4420", "whatsapp": "5574981314420", "state": "BA", "delivery": "1-3 meses", "products": "Bolsa 55, Nécessaire, Carteira alça, Canga elastano, Kit bolsas 125", "categories": ["bolsa", "canga"], "color": "#2E75B6", "files": ["necessaire_imgs", "carteira_imgs", "master"]}, {"id": 5, "name": "SOUVENIR CEARÁ", "contact": "Cleberson Lima", "phone": "+55 84 99983-2590", "whatsapp": "5584999832590", "state": "CE", "delivery": "1 mês", "products": "Chaveiros de nome, Chaveiros diversos", "categories": ["chaveiro"], "color": "#1B5E20", "files": ["chaveiro_imgs", "keychain_ctrl"]}, {"id": 6, "name": "OFICINA DE ARTE - ECOBAGS", "contact": "", "phone": "+55 83 98832-9998", "whatsapp": "5583988329998", "state": "PB", "delivery": "1 semana", "products": "Camisas regionais adulto, Baby look, Regata, Cropped, Infantil", "categories": ["roupa"], "color": "#4A148C", "files": ["vestuario_imgs", "body_imgs", "master"]}, {"id": 7, "name": "VANDA COLORIDO", "contact": "Ivaneide (Vanda)", "phone": "+55 83 98744-1466", "whatsapp": "5583987441466", "state": "PB", "delivery": "", "products": "Body, Vestido, Macaquinho", "categories": ["roupa"], "color": "#AD1457", "files": ["body_imgs", "vestuario_imgs", "master"]}, {"id": 8, "name": "JUNIOR CHAVEIRO", "contact": "Junior", "phone": "+55 84 99869-1997", "whatsapp": "5584998691997", "state": "CE", "delivery": "", "products": "Chaveiro de letras", "categories": ["chaveiro"], "color": "#E65100", "files": ["chaveiro_imgs", "keychain_ctrl", "female_keychain"]}, {"id": 9, "name": "GIRISH INDIANA", "contact": "Girish", "phone": "+55 82 99938-1151", "whatsapp": "5582999381151", "state": "AL", "delivery": "", "products": "Cangas", "categories": ["canga"], "color": "#006064", "files": ["mercadorias_imgs", "master", "suppliers_folder"]}, {"id": 10, "name": "PATRICIA CAMISAS", "contact": "Patricia", "phone": "+55 81 3551-1208", "whatsapp": "5581135511208", "state": "PE", "delivery": "", "products": "Camisa color", "categories": ["roupa"], "color": "#C62828", "files": ["vestuario_imgs", "master"]}, {"id": 11, "name": "MAURÍCIO FRIZZO", "contact": "Maurício Frizzo", "phone": "+55 84 99688-4538", "whatsapp": "5584996884538", "state": "CE", "delivery": "", "products": "Caneca ágata pintura esmaltada automotivo, caneca ágata pequena e grande", "categories": ["caneca"], "color": "#37474F", "files": ["mercadorias_imgs", "master", "suppliers_folder"]}, {"id": 12, "name": "EXCLUSIVART - SARAH CANECAS", "contact": "Sarah", "phone": "+55 83 99853-8103", "whatsapp": "5583998538103", "state": "PB", "delivery": "", "products": "Caneca de louça", "categories": ["caneca"], "color": "#6A1B9A", "files": ["mercadorias_imgs", "master", "suppliers_folder"]}, {"id": 13, "name": "TIAGO MANIA - CHAVEIROS MANIA", "contact": "Tiago Otto", "phone": "+55 51 99728-7440", "whatsapp": "5551997287440", "state": "RS", "delivery": "", "products": "Imã Romero Brito, Chaveiros Mania", "categories": ["chaveiro", "ima"], "color": "#00695C", "files": ["chaveiro_imgs", "keychain_ctrl", "master", "suppliers_folder"]}];
const FILE_LINKS = {"chaveiro_imgs": ["Chaveiros", "FF_imagens_produtos/chaveiros_individuais/"], "necessaire_imgs": ["Nécessaires", "FF_imagens_produtos/necessaires_individuais/"], "carteira_imgs": ["Carteiras", "FF_imagens_produtos/carteiras_individuais/"], "vestuario_imgs": ["Vestuário", "FF_imagens_produtos/vestuario_e_diversos/"], "body_imgs": ["Bodys", "FF_imagens_produtos/bodys_individuais/"], "mercadorias_imgs": ["Mercadorias", "FF_imagens_produtos/mercadorias/"], "keychain_ctrl": ["Controle Chaveiros", "data/raw/keychain_sales_control.xlsx"], "female_keychain": ["Chaveiros Femininos", "data/raw/female_keychain_sales_control.xlsx"], "master": ["Master Excel", "data/excel/FuloFilo_Master.xlsx"], "suppliers_folder": ["Pasta Fornecedores", "data/suppliers/"]};
let searchTerm = "";

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function initials(name) {
  return String(name || "").split(/\s+/).slice(0, 2).map(word => word[0] || "").join("").toUpperCase();
}
function renderFileLinks(keys) {
  const items = (keys || []).map(key => {
    const item = FILE_LINKS[key];
    if (!item) return "";
    return `<a class="cf" href="${ROOT}/${item[1]}" title="${escapeHtml(item[1])}">${escapeHtml(item[0])}</a>`;
  }).join("");
  return items ? `<div class="card-files"><div class="card-files-label">Arquivos relacionados</div>${items}</div>` : "";
}
function render() {
  const q = searchTerm.toLowerCase();
  const filtered = SUPPLIERS.filter(s => !q ||
    String(s.name || "").toLowerCase().includes(q) ||
    String(s.products || "").toLowerCase().includes(q) ||
    String(s.contact || "").toLowerCase().includes(q) ||
    String(s.state || "").toLowerCase().includes(q)
  );
  document.getElementById("count-label").textContent =
    filtered.length + " fornecedor" + (filtered.length !== 1 ? "es" : "") + " encontrado" + (filtered.length !== 1 ? "s" : "");
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">Nenhum fornecedor encontrado.</div>';
    return;
  }
  grid.innerHTML = filtered.map(s => {
    const phoneNum = String(s.phone || "").replace(/\D/g, "");
    const waBtn = s.whatsapp
      ? `<a class="btn btn-wa" href="https://wa.me/${s.whatsapp}" target="_blank">WhatsApp</a>`
      : `<span class="btn btn-na">N/D</span>`;
    const callBtn = phoneNum
      ? `<a class="btn btn-call" href="tel:+${phoneNum}">Ligar</a>`
      : `<span class="btn btn-na">N/D</span>`;
    const contactLine = s.contact ? `<div class="card-contact">${escapeHtml(s.contact)}</div>` : "";
    return `<div class="card">
      <div class="card-header">
        <div class="avatar" style="background:${escapeHtml(s.color || "#546E7A")}">${escapeHtml(initials(s.name))}</div>
        <div><div class="card-name">${escapeHtml(s.name)}</div>${contactLine}</div>
      </div>
      <div class="card-body"><div class="products"><strong>Produtos</strong>${escapeHtml(s.products)}</div></div>
      ${renderFileLinks(s.files)}
      <div class="card-footer">${waBtn}${callBtn}</div>
    </div>`;
  }).join("");
}
document.getElementById("search").addEventListener("input", event => {
  searchTerm = event.target.value;
  render();
});
render();
</script>
</body>
</html>
